name: Lab 2 - Test and deploy Flask to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create application directory on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            mkdir -p /home/ubuntu/flask-app

      - name: Copy application files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "app.py,requirements.txt,templates/"
          target: "/home/ubuntu/flask-app/"

      - name: Install and restart Flask application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /home/ubuntu/flask-app

            echo "Creating Python virtual environment"
            python3 -m venv .venv

            echo "Installing dependencies"
            .venv/bin/pip install -r requirements.txt

            echo "Stopping previous Gunicorn process"
            if [ -f gunicorn.pid ]; then
              kill "$(cat gunicorn.pid)" || true
              rm -f gunicorn.pid
            fi

            echo "Starting Flask application"
            APP_VERSION="${{ github.sha }}" .venv/bin/gunicorn \
              --workers 2 \
              --bind 0.0.0.0:5000 \
              --daemon \
              --pid gunicorn.pid \
              app:app

            sleep 3

            echo "Checking application health"
            curl --fail http://localhost:5000/health
